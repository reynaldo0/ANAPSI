# Blindspot production stack (VPS):
#   caddy (public TLS + reverse proxy) -> web (Next.js) -> backend (Go) -> db (MySQL)
#
# Setup:
#   1. cd deploy && cp .env.example .env   (edit semua nilai, terutama AUTH_SECRET)
#   2. docker compose up -d --build
#   3. docker compose ps          # tunggu hingga healthcheck "healthy"
#
# Upgrade: docker compose up -d --build  (zero-downtime berkat container restart)
# Slack space? mysql data persistent di named volume `dbdata`; lihat: docker volume ls

name: blindspot

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "blindspot"
      MYSQL_USER: "blindspot"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      MYSQL_DSN: "blindspot:${MYSQL_PASSWORD}@tcp(db:3306)/blindspot?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci"
      AUTH_SECRET: "${AUTH_SECRET}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      APP_ORIGINS: "${APP_ORIGINS}"
      COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"
      DB_MAX_OPEN: "${DB_MAX_OPEN:-40}"
      DB_MAX_IDLE: "${DB_MAX_IDLE:-10}"
      DB_CONN_LIFETIME_SECONDS: "${DB_CONN_LIFETIME_SECONDS:-300}"
    depends_on:
      db:
        condition: service_healthy
    # Ops inspect: 127.0.0.1:8081 -> container 8080 (jangan dibuka publik)
    ports:
      - "127.0.0.1:8081:8080"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      AUTH_SECRET: "${AUTH_SECRET}"
      INTERNAL_API_URL: "http://backend:8080"
      BACKEND_URL: "http://backend:8080"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  dbdata:
  caddy_data:
  caddy_config: